# 16x16 3-state Potts above the transition, beta = 0.5 (beta_c = 1.005).
#
# No ordered mode: the majority state of a configuration is close to uniform
# noise, so `mode_min` sits near 1/3 for any sampler and the discriminating
# criteria here are the energy histogram, the two-point function and the ESS.
name: potts
lattice_shape: [16, 16]
q: 3
beta: 0.5
J: 1.0
